services:
  email-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-agent
    restart: always
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/emails.db
      - ATTACHMENTS_DIR=/app/data/attachments
      - SKILLS_DIR=/app/skills
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills:ro
    security_opt:
      - no-new-privileges:true
